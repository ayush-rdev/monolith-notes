name: Release Multiplatform Desktop & Mobile

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Target Release Tag'
        required: false
        default: 'v2.7.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Frontend Dependencies
        run: |
          cd desktop
          npm ci

      - name: Build Tauri Desktop Apps
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './desktop'
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Monolith Notes ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            ## Monolith Notes ${{ inputs.tag || github.ref_name }}
            
            A tactile, distraction-free markdown journal and Obsidian-grade personal knowledge graph with 100% local-first file sovereignty. Available across Android, macOS, Windows, and Linux.
            
            ### Cross-Platform Downloads
            - **macOS**: `.dmg` (Apple Silicon & Intel)
            - **Windows**: `.exe` (NSIS Installer) / `.msi`
            - **Linux**: `.AppImage` / `.deb` / `.tar.gz`
            - **Android**: `Monolith-Notes-v2.7.0.apk`
            
            ### Co-Authors & Contributors
            - **Ayush** ([@ayush-rdev](https://github.com/ayush-rdev)) — Mobile Engine, Knowledge Graph, Neural Retrieval
            - **Parikshit** ([@parixiit](https://github.com/parixiit)) — Tauri Desktop Architecture, Live WYSIWYG
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
