[package]
name = "monolith-desktop"
version = "1.4.0"
description = "Tactile, Distraction-Free Markdown Journal for Desktop"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
dirs = "5.0"
